function subTap(id){const a=S.sel2;if(!a||a==id){S.sel2=a==id?null:id;subRender();return}S.sel2=null;if(!subDo(a,id))S.sel2=id;subRender()}

function winBox(){const w=winInfo(),pd=S.pend||[];return'<div class="box"><h3>Transfer window: <span class="'+(w.open?'good':'bad')+'">'+(w.open?w.nm+' window OPEN':'CLOSED')+'</span></h3><p class="mut">'+(w.open?'Deals complete immediately. The window closes after '+w.w+' more matchday'+(w.w==1?'':'s')+'.':'You can still agree deals. Signings and sales complete when the '+w.nm+' window opens'+(S.over?' next season.':' in '+w.w+' matchday'+(w.w==1?'':'s')+'.'))+'</p>'+(pd.length?'<div class="wrap"><table>'+pd.map((x,i)=>'<tr><td class="l">'+(x.t=='buy'?'Buy: ':'Sell: ')+x.nm+(x.tn?' to '+x.tn:'')+'</td><td>£'+x.fee+'m</td><td><button class="b s" onclick="cancelPend('+i+')">Cancel</button></td></tr>').join('')+'</table></div><p class="mut">Money moves when the deal completes. Budget committed to signings: £'+pendN('buy').reduce((a,x)=>a+x.fee,0).toFixed(1)+'m.</p>':'')+'</div>'}
const MN=['August','September','October','November','December','January','February','March','April','May'],MD=[31,30,31,30,31,31,28,31,30,31];
function gdate(){const L=S.fx[D()].length,r=Math.min(S.round,L),y0=2025+S.season;if(S.over||r>=L)return{txt:'End of May '+(y0+1)+' (season over)',next:'1 August '+(y0+1),nd:'next season'};
const m=Math.min(9,Math.floor(r*10/L)),a=Math.ceil(m*L/10),b=m==9?L:Math.ceil((m+1)*L/10),f=b>a?(r-a)/(b-a):0,day=1+Math.round(f*(MD[m]-1)),y=y0+(m>=5?1:0),nm=m<9?m+1:0,ny=m<9?y0+(nm>=5?1:0):y0+1,nr=Math.ceil((m+1)*L/10)-r;return{txt:day+' '+MN[m]+' '+y,next:'1 '+MN[nm]+' '+ny,nd:'in '+nr+' matchday'+(nr==1?'':'s')}}
function homeDate(){const g=gdate(),L=S.fx[D()].length;return'<div class="box" style="margin-bottom:12px;padding:8px 12px"><b>'+g.txt+'</b> <span class="mut">· Matchday '+Math.min(S.round+1,L)+' of '+L+' · Scout reports and new scouts: '+g.next+' ('+g.nd+')</span></div>'}
function homeWin(){const w=winInfo(),n=(S.pend||[]).length;if(!w.open&&!n)return'';return'<div class="box" style="margin-bottom:12px;cursor:pointer" onclick="go(\'transfers\')">'+(w.open?'<b class="good">'+w.nm+' transfer window OPEN</b> <span class="mut">Closes after '+w.w+' more matchday'+(w.w==1?'':'s')+'. Deals complete immediately.</span>':'<b>Transfer window closed</b> <span class="mut">'+n+' deal'+(n==1?'':'s')+' pending, completes when the '+w.nm+' window opens.</span>')+'</div>'}
function cancelPend(i){const x=S.pend[i];if(!x)return;const f=findP(x.id);if(f)f.p.pend=0;S.pend.splice(i,1);render()}
function runPend(){const me=S.teams[S.me],pd=S.pend||[];if(!pd.length)return;S.pend=[];const out=[];
pd.filter(x=>x.t=='sell').forEach(x=>{const p=me.sq.find(q=>q.id==x.id);if(!p){out.push('Sale of '+x.nm+' fell through.');return}doSale(p,x.to,x.fee);out.push('Sold '+p.n+(x.tn?' to '+x.tn:'')+' for £'+x.fee+'m.')});
pd.filter(x=>x.t=='buy').forEach(x=>{const f=findP(x.id);if(!f||f.t===me||!canSign(f.t)){out.push('Signing of '+x.nm+' fell through.');return}const p=f.p,t=f.t;p.pend=0;if(me.sq.length>=25){out.push('Signing of '+p.n+' cancelled: squad full.');return}if(x.fee>S.cash){out.push('Signing of '+p.n+' cancelled: not enough budget.');return}S.cash-=x.fee;t.sq.splice(t.sq.indexOf(p),1);refill(t);p.st=100;p.tl=false;p.q=null;p.scouting=false;p.blk=0;delete p.sn;me.sq.push(p);if(p.ovr>=BT())S.signedStar++;out.push('Signed '+p.n+' from '+t.n+' for £'+x.fee+'m.');logT({k:'in',nm:p.n,pos:p.pos,ovr:p.ovr,from:t.n,fee:x.fee})});
nums(me);S.news.unshift('The '+winInfo().nm+' transfer window has opened. '+out.join(' '))}
function nego(id){const x=findP(id),p=x.p,q=quote(p);if(p.pend)return;if(!canSign(x.t)){S.pop={t:'Unwilling to join',m:p.n+' is unwilling to move to your club because '+DV[D()][0]+' is too low a league for him. With Harder transfers on, you can only sign players from '+(D()?DV[D()-1][0]+' and below':'any league')+'.'};render();return}if(sqN()>=25){S.neg={id,nm:p.n,info:'',msg:'Your squad is full (25 players). Sell a player before signing anyone.',end:1,bad:1};render();return}S.neg={id,nm:p.n,info:p.pos+', age '+p.age+', rating '+p.ovr+', potential '+pr(p)+', '+x.t.n+' ('+DV[x.t.dv][0]+'). Market value £'+p.val.toFixed(1)+'m'+(p.tl?', transfer listed':', not listed')+'.',msg:x.t.n+' are asking £'+q.ask+'m. What is your opening bid?',ctr:0,bid:q.ask,rn:0};render()}
function offer(){const n=S.neg,x=findP(n.id),b=Math.round(+$('bd').value*10)/10;if(!x){S.neg=null;render();return}const p=x.p,q=quote(p);if(!(b>0))return;if(b>avail()){n.bad=1;n.msg='You cannot afford that. Available budget: £'+avail().toFixed(1)+'m.';n.bid=b;render();return}n.rn++;const r=q.res;n.bid=b;
if(b>=r){buy(p.id,b);return}
if(n.rn>=3){n.msg=x.t.n+' are tired of the haggling and have ended talks.';n.end=1;n.ctr=0;p.blk=S.season*100+S.round+3;S.news.unshift(x.t.n+' ended talks over '+p.n+'.');render();return}
n.bad=1;if(b>=r*.85){n.ctr=Math.round(Math.max(r*R(1,1.05),b+.1)*10)/10;n.msg=x.t.n+' rejected £'+b+'m. You need to bid more: they would accept £'+n.ctr+'m. ('+(3-n.rn)+' round(s) left)'}else{n.ctr=0;n.msg=x.t.n+' laughed off £'+b+'m. You are well short, so bid a lot more. ('+(3-n.rn)+' round(s) left)'}render()}
function buy(id,fee){const x=findP(id);if(!x){S.neg=null;render();return}const p=x.p,t=x.t,q=quote(p);if(sqN()>=25){S.neg.msg='Your squad is full (25 players).';S.neg.end=1;render();return}if(fee>avail()){S.neg.msg='You cannot afford £'+fee+'m.';render();return}
const win=winInfo(),late=!win.open;if(late){p.pend='buy';(S.pend=S.pend||[]).push({t:'buy',id:p.id,fee,nm:p.n});S.news.unshift('Agreed to sign '+p.n+' from '+t.n+' for £'+fee+'m. He joins when the '+win.nm+' window opens.')}else{
S.cash-=fee;t.sq.splice(t.sq.indexOf(p),1);refill(t);p.st=100;p.tl=false;p.q=null;p.scouting=false;p.blk=0;delete p.sn;const me=S.teams[S.me];me.sq.push(p);nums(me);if(p.ovr>=BT())S.signedStar++;S.news.unshift('Signed '+p.n+' from '+t.n+' for £'+fee+'m.');logT({k:'in',nm:p.n,pos:p.pos,ovr:p.ovr,from:t.n,fee})}
const r=q.res,qq=fee/r,G=qq<=1.005?['A+','Perfect deal. You paid the club\'s minimum.']:qq<=1.03?['A','Excellent deal. Almost the lowest price they would take.']:qq<=1.07?['B','Good deal, with a little left on the table.']:qq<=1.12?['C','Fair deal, but you could have paid less.']:qq<=1.2?['D','You overpaid.']:['E','You badly overpaid.'];S.deal={nm:p.n,club:t.n,fee,best:r,ask:q.ask,g:G[0],t:G[1],late:late?win.nm:0};S.neg=null;render()}
function capSquad(t){const mins={GK:2,DF:5,MF:5,FW:3};let n=0;while(t.sq.length>25){const o=t.sq.slice().sort((a,b)=>a.ovr-b.ovr),c=o.find(p=>t.sq.filter(x=>grp(x.pos)==grp(p.pos)).length>mins[grp(p.pos)])||o[0];t.sq.splice(t.sq.indexOf(c),1);n++}if(n&&S&&t===S.teams[S.me])S.news.unshift('Your squad was trimmed to the 25 player limit ('+n+' lowest-rated players released).');return n}
function develop(p,focus){const a=p.age,gap=p.pot-p.ovr;let gr;
if(a<24)gr=gap>0?gap*R(.2,.6)*(focus?1.4:1):0;
else if(a<=28)gr=gap>0?gap*R(.08,.3):0;
else if(a<=30)gr=Math.random()<.4?0:-RI(0,1);
else gr=-RI(0,2)-(a>=34?1:0);
return Math.round(gr)}
function revalue(p,oo,oa){p.val=fcVal(p.ovr,p.pot,p.age)}
function ageAll(){S.teams.forEach((t,i)=>t.sq.forEach(p=>{plan(p,i==S.me&&S.train=='Focused'&&p.age<24,0,S.season+1);p.age++;p.rs=0;p.rn=0;p.rl=[];p.val=fcVal(p.ovr,p.pot,p.age)}))}
function dlt(p){const d=p.gs===S.season&&p.o0!=null?p.ovr-p.o0:0;return d?' <b class="'+(d>0?'good':'bad')+'" style="font-size:.82em">'+(d>0?'+':'-')+Math.abs(d)+'</b>':''}
const NH=()=>Math.ceil(S.fx[D()].length/2),avgRl=p=>{const w=p.rl||[];return w.length?w.reduce((s,x)=>s+x,0)/w.length/10:0};
function exceedPot(){const need=NH();S.teams.forEach(t=>t.sq.forEach(p=>{if(p.ovr>=p.pot&&(p.rl||[]).length>=need&&avgRl(p)>7&&p.ovr<99){p.ovr++;p.pot=p.ovr;p.bx=(p.bx||0)+1;p.at=p.at.map((x,j)=>j<6||p.pos=='GK'?cl(x+1,20,95):x);p.val=fcVal(p.ovr,p.pot,p.age);p.rl=[]}}))}
function plan(p,focus,f0,s){p.bx=0;p.o0=p.ovr;p.gr=develop(p,focus);p.f0=f0;p.gs=s}
function planNew(s){S.teams.forEach((t,i)=>t.sq.forEach(p=>{if(p.gs!==s)plan(p,i==S.me&&S.train=='Focused'&&p.age<24,0,s)}))}
function growAll(){const L=S.fx[D()].length,f=Math.min(1,S.round/L);S.teams.forEach((t,i)=>t.sq.forEach(p=>{if(p.gs!==S.season)plan(p,false,f,S.season);const d0=1-p.f0,n=cl(p.o0+(p.bx||0)+(d0>0?Math.round(p.gr*(f-p.f0)/d0):0),35,95),d=n-p.ovr;if(!d)return;p.ovr=n;p.at=p.at.map((x,j)=>j<6||p.pos=='GK'?cl(x+d,20,95):x);if(p.ovr>p.pot)p.pot=p.ovr;p.peak=Math.max(p.peak||0,p.ovr);p.val=fcVal(p.ovr,p.pot,p.age)}))}
function mkRegen(r){const pk=Math.max(r.pot||0,r.peak||0,r.ovr,50);let st=pk>=88?R(79,81):pk>=83?R(73,78):pk>=76?R(68,72):pk>=70?R(64,69):pk-R(8,13);st=Math.max(38,Math.round(Math.min(st,pk-3)));const age=RI(16,18),p=mk(r.pos,st,age);p.ovr=st;p.pot=pk;p.age=age;p.at=PR[grp(r.pos)].map(w=>cl(Math.round(st+w+R(-5,5)),22,95));p.at.push(r.pos=='GK'?st:RI(8,18));p.val=fcVal(st,pk,age);p.wage=Math.max(2,Math.round(Math.round(Math.pow(st/50,6)*.8*1.3*10)/10*5));p.peak=st;p.regen=1;p.nat=nat(r);return p}
function retireAll(){S.rt={out:[]};S.teams.forEach((t,i)=>{const out=t.sq.filter(p=>{const a=p.age-(p.pos=='GK'?2:0);let pr=a<34?0:a==34?.12:a==35?.3:a==36?.55:a==37?.8:1;if(a>=33&&p.ovr<60)pr+=.2;return Math.random()<pr});
out.forEach(p=>{t.sq.splice(t.sq.indexOf(p),1);const r=mkRegen(p);t.sq.push(r);if(i==S.me){S.rt.out.push({o:{n:p.n,age:p.age,pos:p.pos,ovr:p.ovr},r:{n:r.n,age:r.age,pos:r.pos,ovr:r.ovr,pot:r.pot,nat:ncode(r)}});S.news.unshift(p.n+' ('+p.age+') has retired. A regen joins: '+r.n+', '+r.age+', '+r.pos+', rating '+r.ovr+', potential '+r.pot+'.')}else if(Math.max(p.peak||0,p.ovr)>=85)S.news.unshift('Legend '+p.n+' retires from football at '+p.age+'.')});if(out.length)nums(t)})}
function startScr(){$('hd').innerHTML='<b>Touchline</b><span>Choose a save slot</span><button class="b s" style="margin-left:auto" onclick="openSettings()">Settings</button>';$('nv').innerHTML='';
$('app').innerHTML='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">'+Array.from({length:CFG.slots||10},(_,i)=>i+1).map(n=>{const m=slotInfo(n);return'<div class="box">'+slotHead(n)+(m?'<p><b>'+m.club+'</b><br>'+m.div+', season '+m.season+', matchday '+m.md+'/'+m.len+'<br><span class="mut">Board '+m.conf+'% | Budget \u00a3'+m.cash+'m</span></p><div class="row">'+(DELN==n?'<button class="b" style="background:var(--r);border-color:var(--r)" onclick="delSave('+n+');DELN=0;startScr()">Yes, delete</button><button class="b s" onclick="DELN=0;startScr()">Cancel</button>':'<button class="b" onclick="loadGame('+n+')">Continue</button><button class="b s" onclick="DELN='+n+';startScr()">Delete</button>')+'</div>':'<p class="mut">Empty slot</p><div class="row"><button class="b" onclick="pickScr('+n+')">New career</button></div>')+'</div>'}).join('')+'</div><p class="mut">Saves are kept in this browser and update automatically. Use Save and exit in the top bar to come back here.</p><div class="row"><button class="b s" onclick="addSlot()">+ Add another save slot</button></div>'}
function pickScr(n){PSLOT=n;$('hd').innerHTML='<b>Touchline</b><span>New career, '+slotName(n)+'</span>';$('app').innerHTML='<div class="box"><h2>Choose your club</h2><p>Pick any club in the top four English divisions.</p><div class="row"><label>League <select id="pd" onchange="pickDiv()">'+DV.map((d,k)=>'<option value="'+k+'" '+(k==3?'selected':'')+'>'+d[0]+'</option>').join('')+'</select></label><label>Club <select id="cs" onchange="pickInfo()"></select></label></div><p id="pi" class="mut"></p><label class="row" style="gap:8px"><input type="checkbox" id="hd2"> <b>Harder transfers</b></label><p class="mut" style="margin-top:0">You can only sign players from one league above yours or lower. For example, in League One you can sign League One, League Two and Championship players. This follows your league each season.</p><p style="margin-bottom:4px"><b>Board objectives</b> <select id="bdm" onchange="bdTxt()">'+Object.keys(BD).map(k=>'<option value="'+k+'">'+BD[k].nm+'</option>').join('')+'</select></p><p class="mut" id="bdt" style="margin-top:0">'+BD.standard.ds+'</p><label class="row" style="gap:8px"><input type="checkbox" id="hpm"> <b>Hidden potential (hard mode)</b></label><p class="mut" style="margin-top:0">Players at other clubs show a potential range up to 15 wide instead of 5. The only way to narrow it is to scout the player. Your own squad still shows exact potential.</p><label class="row" style="gap:8px"><input type="checkbox" id="fb" onchange="fbTog()"> <b>Financial boost</b></label><div id="fbw" style="display:none"><p class="mut" style="margin-top:0">Extra money added to your starting budget. You choose how much (0 to 1000).</p><div class="row"><label>Amount <input id="fba" type="number" min="0" max="1000" step="5" value="50" style="width:110px"> £m</label></div></div><label class="row" style="gap:8px"><input type="checkbox" id="cm" onchange="pickCust()"> <b>Create my own club</b></label><div id="cust" style="display:none"><p class="mut" style="margin-top:0">Your club takes the place of the club chosen in the Club box above. That club and its players are removed from this career, and you start with a generated squad.</p><div class="row"><label>Name <input id="cn" maxlength="24" placeholder="e.g. Hendon Town"></label><label>Primary <input type="color" id="cc1" value="#1d8a4b"></label><label>Secondary <input type="color" id="cc2" value="#ffffff"></label></div></div><div class="row"><button class="b" onclick="startCareer()">Start career</button><button class="b s" onclick="startScr()">Back</button></div></div>';pickDiv()}

function hpOpt(){const e=$('hpm');return!!(e&&e.checked)}

function startCareer(){const me=+$('cs').value;if($('cm')&&$('cm').checked){const n=($('cn').value||'').replace(/&/g,'and').replace(/[^\p{L}0-9 .-]/gu,'').trim().replace(/\s+/g,' ');if(n.length<3){alert('Give your club a name (at least 3 letters).');return}if(DV.some(d=>d[1].some(c=>c.toLowerCase()==n.toLowerCase()))){alert('That name is already used by a real club. Pick another.');return}newGame(me,PSLOT,hardOpt(),{n,c1:$('cc1').value,c2:$('cc2').value},boostOpt(),boardOpt(),hpOpt());return}newGame(me,PSLOT,hardOpt(),undefined,boostOpt(),boardOpt(),hpOpt())}
